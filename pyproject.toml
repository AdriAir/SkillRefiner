[project]
name = "skill-refiner-development"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["PyYAML==6.0.3", "jsonschema==4.25.1"]

[project.optional-dependencies]
test = ["pytest==8.4.2", "pytest-cov==7.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["docker: requires an accessible local Docker Linux engine and a pinned image"]
